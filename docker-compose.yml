# Services that do real work: db, dashboard_agent (FastAPI + in-process pipeline
# runs) and frontend (Next.js). The orchestrator and the four pipeline agents
# are libraries that dashboard_agent imports, so their containers idle on
# `sleep infinity` -- they exist only for `docker compose exec <service> pytest`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: biflow
      POSTGRES_PASSWORD: biflow
      POSTGRES_DB: biflow
    ports:
      # Host port 5433 (not 5432) to avoid clashing with a native Postgres
      # install some dev machines already have listening on 5432.
      - "5433:5432"
    volumes:
      - biflow_pgdata:/var/lib/postgresql/data

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    depends_on:
      - db
      - data_engineering_agent
      - kpi_semantic_agent
      - bi_analyst_agent
      - dashboard_agent
      - auditor_xai_agent
    env_file: .env
    volumes:
      - .:/app

  data_engineering_agent:
    build:
      context: .
      dockerfile: agents/data_engineering_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

  kpi_semantic_agent:
    build:
      context: .
      dockerfile: agents/kpi_semantic_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

  bi_analyst_agent:
    build:
      context: .
      dockerfile: agents/bi_analyst_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

  dashboard_agent:
    build:
      context: .
      dockerfile: agents/dashboard_agent/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - dashboard_agent
    environment:
      # Fetched from the browser, not from inside the docker network -- must
      # be reachable from the host, not the dashboard_agent service name.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  auditor_xai_agent:
    build:
      context: .
      dockerfile: agents/auditor_xai_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

volumes:
  biflow_pgdata:
