# TODO (owner, Person E): flesh out build contexts/Dockerfiles per service
# once each agent has real dependencies. This stub wires up the topology
# (one service per agent + orchestrator + dashboard + db) so integration
# issues surface early, even before real logic is written.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: biflow
      POSTGRES_PASSWORD: biflow
      POSTGRES_DB: biflow
    ports:
      - "5432:5432"
    volumes:
      - biflow_pgdata:/var/lib/postgresql/data

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    depends_on:
      - db
      - data_engineering_agent
      - kpi_semantic_agent
      - bi_analyst_agent
      - dashboard_agent
      - auditor_xai_agent
    env_file: .env
    volumes:
      - .:/app

  data_engineering_agent:
    build:
      context: .
      dockerfile: agents/data_engineering_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

  kpi_semantic_agent:
    build:
      context: .
      dockerfile: agents/kpi_semantic_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

  bi_analyst_agent:
    build:
      context: .
      dockerfile: agents/bi_analyst_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

  dashboard_agent:
    build:
      context: .
      dockerfile: agents/dashboard_agent/Dockerfile
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app

  auditor_xai_agent:
    build:
      context: .
      dockerfile: agents/auditor_xai_agent/Dockerfile
    env_file: .env
    volumes:
      - .:/app

volumes:
  biflow_pgdata:
